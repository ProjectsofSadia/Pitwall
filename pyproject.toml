[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitwall"
version = "0.0.1"
description = "Uncertainty-aware race strategy decision support from public F1 timing data"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Kazi Sadia Anowar" }]

# Phase 0 dependencies only. Nothing is listed here that Phase 0 does not import.
# fastf1 is pinned exactly: its dataframe schemas and property names have changed
# between minor releases, and the audit asserts against specific column names.
dependencies = [
    "fastf1==3.8.1",  # see PINNED_FASTF1_VERSION in src/data/fastf1_loader.py
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test requires the F1 live timing API or a warm FastF1 cache",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
